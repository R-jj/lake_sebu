org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Suppress obsolete Java source/target compatibility warnings from third-party
# libraries (e.g. cloud_firestore) that still compile against Java 8.
android.suppressUnsupportedCompileSdkVersions=true
org.gradle.warning.mode=none
